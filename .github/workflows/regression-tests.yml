name: Regression tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "refactor/**"
      - "docs/**"
      - "fix/**"
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Run regression suite on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\windows\run-tests.cmd

      - name: Run regression suite on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/linux/run-tests.sh

      - name: Seed stale pre-refactor Emby obj on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'src/Emby/obj/Release/netstandard2.0' | Out-Null
          Set-Content -LiteralPath 'src/Emby/obj/Release/netstandard2.0/LegacyAssemblyInfo.cs' -Value '[assembly: System.Reflection.AssemblyCompany("Legacy generated state")]' -Encoding UTF8

      - name: Build Emby plugin on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\windows\build-emby.cmd

      - name: Build Jellyfin plugin and package on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\windows\build-jellyfin.cmd
